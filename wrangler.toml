name = "dual-ping-worker"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
GITHUB_OWNER = "mehrdadmb2"
GITHUB_REPO = "dual-ping-monitor"
GITHUB_BRANCH = "main"
REQUEST_TIMEOUT_MS = "8000"

[triggers]
crons = ["*/10 * * * *"]

# Secrets are NOT committed here:
# wrangler secret put GITHUB_TOKEN
# wrangler secret put RUN_KEY
#
# RUN_KEY is only needed if you want to invoke POST /run manually.
