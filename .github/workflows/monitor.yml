name: Dual Ping Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Serializes Actions runs. The push step below also rebases/retries because the
# Cloudflare Worker is an independent writer to the same main branch.
concurrency:
  group: dual-ping-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Run resilient probes
        env:
          SOURCE: github
          TIMEOUT_MS: 5000
          ICMP_TIMEOUT_SEC: 2
          ICMP_SAMPLES: 2
          CONCURRENCY: 8
          DNS_TEST_NAME: example.com
        run: node .github/scripts/ping.js

      - name: Build merged dataset and index
        run: node .github/scripts/merge.js

      - name: Sync datasets into GitHub Pages publish directory
        run: |
          mkdir -p docs/data
          cp -R data/. docs/data/

      - name: Commit monitoring data and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dual Ping Monitor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore(data): update monitoring snapshot [skip ci]"

          # Cloudflare Cron also writes to main via the GitHub Contents API.
          # Fetch/rebase before each push and retry if the other writer wins the race.
          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4: syncing with origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Aborting rather than force-pushing and risking history loss."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Monitoring snapshot pushed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Could not push after four attempts because main kept changing."
          exit 1
