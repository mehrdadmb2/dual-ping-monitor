name: Dual Ping Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: dual-ping-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Run resilient probes
        env:
          SOURCE: github
          TIMEOUT_MS: 5000
          ICMP_TIMEOUT_SEC: 2
          ICMP_SAMPLES: 2
          CONCURRENCY: 8
          DNS_TEST_NAME: example.com
        run: node .github/scripts/ping.js

      - name: Build merged dataset and index
        run: node .github/scripts/merge.js

      - name: Sync datasets into GitHub Pages publish directory
        run: |
          mkdir -p docs/data
          cp -R data/. docs/data/

      - name: Commit monitoring data
        run: |
          git config user.name "Dual Ping Monitor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update monitoring snapshot [skip ci]"
          git push
