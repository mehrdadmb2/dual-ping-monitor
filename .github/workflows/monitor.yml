name: Dual Ping Monitor v4.0.1

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: dual-ping-monitor-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    name: Probe · Merge · Publish
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate source files
        run: |
          node --check .github/scripts/ping.js
          node --check .github/scripts/merge.js
          node --check .github/scripts/validate.js
          node --check .github/scripts/smoke-test.js
          node --check .github/scripts/ui-bootstrap-test.js
          node --check .github/scripts/service-worker-test.js
          node --check docs/script.js
          node --check docs/config.js
          node --check docs/sw.js
          cp cloudflare/worker.js /tmp/dual-ping-worker-check.mjs
          node --check /tmp/dual-ping-worker-check.mjs
          node .github/scripts/validate.js
          node .github/scripts/smoke-test.js
          node .github/scripts/ui-bootstrap-test.js
          node .github/scripts/service-worker-test.js

      - name: Run resilient probes
        env:
          SOURCE: github
          TIMEOUT_MS: 6500
          ICMP_TIMEOUT_SEC: 2
          ICMP_SAMPLES: 3
          CONCURRENCY: 7
          DNS_TEST_NAME: example.com
        run: node .github/scripts/ping.js

      - name: Build merged history and index
        run: node .github/scripts/merge.js

      - name: Publish data and target catalog to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/data/github docs/data/merged
          cp -R data/github/. docs/data/github/
          cp -R data/merged/. docs/data/merged/
          cp data/index.json docs/data/index.json
          cp targets.json docs/targets.json
          echo "Published GitHub history, merged snapshots, index and target catalog."

      - name: Commit monitoring data safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Dual Ping Monitor Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/github/ docs/data/merged/ docs/data/index.json docs/targets.json
          if git diff --cached --quiet; then
            echo "No monitoring data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update v4 monitoring snapshot [skip ci]"

          # Cloudflare writes only docs/data/cloudflare; this workflow writes the
          # GitHub source and merged/index files. Retry if main advances mid-push.
          for attempt in 1 2 3 4; do
            echo "Push attempt ${attempt}/4: syncing with origin/main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict. Aborting safely; no force push will be attempted."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Monitoring snapshot committed and pushed."
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 2)); fi
          done
          echo "Push failed after four attempts."
          exit 1
