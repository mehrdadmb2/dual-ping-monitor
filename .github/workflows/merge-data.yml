name: Merge Data

on:
  schedule:
    - cron: '*/30 * * * *'   # هر ۳۰ دقیقه
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Merge data
        run: |
          mkdir -p data/merged
          node .github/scripts/merge.js

      - name: Commit merged data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/merged/
          git diff --staged --quiet || git commit -m "📊 Update merged data [skip ci]"
          git push
