name: Ping Monitor

on:
  schedule:
    - cron: '*/15 * * * *'   # هر ۱۵ دقیقه یک بار اجرا میشه
  workflow_dispatch:         # اجازه میده دستی هم اجراش کنی

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # برای کامیت کردن فایل‌ها توی مخزن نیازه

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ping script
        run: |
          mkdir -p data/logs
          node .github/scripts/ping.js

      - name: Commit and push results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/logs/
          git diff --staged --quiet || git commit -m "Update ping data [skip ci]"
          git push
